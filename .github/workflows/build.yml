name: Build and push Docker image

on:
  push:
    branches:
      - main

jobs:
  lint-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pre-commit pyright scikit-learn-stubs

      - name: Show package versions
        run: |
          python -m pip show statsmodels
          python -m pip show scikit-learn
          python -m pip show pyright

      - name: Diagnose type information
        run: |
          echo "=== Additional type stub packages ==="
          python -m pip show pandas-stubs || true
          python -m pip show sklearn-stubs || true
          python -m pip show statsmodels-stubs || true

          echo "=== Installed module locations ==="
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          for module in [
              "statsmodels",
              "sklearn",
              "pandas",
          ]:
              spec = importlib.util.find_spec(module)
              print(f"\n{module}: {spec.origin}")

              if spec.submodule_search_locations:
                  root = Path(list(spec.submodule_search_locations)[0])
                  stubs = list(root.rglob("*.pyi"))
                  print(f"Found {len(stubs)} stub files")
                  for stub in stubs[:15]:
                      print(f"  {stub}")
          PY

          echo "=== Pyright verbose diagnostics ==="
          pyright --verbose || true

      - name: Run pre-commit hooks
        run: pre-commit run

      - name: Run pyright
        run: pyright


  build_and_push:
    runs-on: ubuntu-latest
    needs: lint-test   # wichtig: erst testen, dann bauen

    steps:
      - uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to Docker Hardened Images
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{ vars.DOCKER_USERNAME }}/${{ github.event.repository.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
