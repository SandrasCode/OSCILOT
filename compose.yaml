services:
  server:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    #image: cypria/weiterbildung-dev:latest
    ports:
      - "8001:8001"
    environment:
      - MYSQL_HOST=db
      - MYSQL_USER=root
      - MYSQL_DATABASE=example
      - MYSQL_PASSWORD_FILE=/run/secrets/db-password
    depends_on:
      db:
        condition: service_healthy
    secrets:
      - db-password
    develop:
      watch:
        - action: sync+restart
          path: .
          target: /app
        - action: rebuild
          path: requirements.txt
        # - action: rebuild
        #   path: .

  db:
    image: mysql:9
    restart: always
    secrets:
      - db-password
    volumes:
      - db-data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      - MYSQL_DATABASE=example
      - MYSQL_ROOT_PASSWORD_FILE=/run/secrets/db-password
    expose:
      - "3306"
    healthcheck:
      # test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$(cat /run/secrets/db-password)"]
      # test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$(cat /run/secrets/db-password)"]
      # <- problem with those two options is that it tests the health INSIDE the container. it can happen that a tcp request is not yet possible
      test: ["CMD-SHELL", "mysql -uroot -p$$(cat /run/secrets/db-password) -e 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  db-data:

secrets:
  db-password:
    file: db/password.txt